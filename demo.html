<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wander — walk into a video</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23121213'/%3E%3Cpath d='M3 5.4l1.7 5.2L6.9 6.6l2.2 4L10.8 5.4' fill='none' stroke='%23ededee' stroke-width='1.3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f0f0f2;
        --surface: #e8e8eb;
        --surface-2: #e0e0e4;
        --line: #dcdbe0;
        --line-2: #d3d2d8;
        --ink: #1e1d22;
        --ink-2: #4b4a52;
        --mute: #8b8996;
        --dim: #b3b1bb;
        --pill: #2a292f;
        --rail: 320px;
        --serif: 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
        --sans: 'Manrope Variable', 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      kbd {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        padding: 3px 5px 2px;
        border-radius: 5px;
        border: 1px solid var(--line-2);
        background: #fff;
        color: var(--ink-2);
        vertical-align: 1px;
      }
      h1,
      h2 {
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: -0.015em;
        margin: 0;
      }
      .label {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--mute);
      }
      p {
        margin: 0;
      }

      #shell {
        display: grid;
        grid-template-rows: 60px 1fr;
        grid-template-columns: var(--rail) 1fr;
        height: 100%;
        transition: grid-template-columns 0.22s ease;
      }
      #shell.norail {
        grid-template-columns: 0 1fr;
      }
      #shell.norail #rail {
        visibility: hidden;
        border-right-color: transparent;
      }
      .railbtn {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        margin-right: -6px;
        transition: background 0.15s;
      }
      .railbtn:hover {
        background: var(--surface);
      }
      .railbtn span {
        display: block;
        width: 15px;
        height: 1.5px;
        background: var(--ink-2);
        border-radius: 1px;
      }

      /* ---------------- header ---------------- */
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 24px 0 24px;
        border-bottom: 1px solid var(--line);
      }
      .wordmark {
        font-family: var(--serif);
        font-size: 26px;
        letter-spacing: -0.02em;
        line-height: 1;
        padding-top: 2px;
      }
      .spacer {
        flex: 1;
      }
      .hbtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line-2);
        color: var(--ink-2);
        font-weight: 500;
        font-size: 13px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .hbtn:hover {
        background: var(--surface);
        color: var(--ink);
      }
      .hbtn.on {
        background: var(--pill);
        border-color: var(--pill);
        color: #fff;
      }
      .hbtn.on kbd {
        background: #fff2;
        border-color: #fff3;
        color: #fff;
      }
      .hbtn kbd {
        background: var(--bg);
      }
      .hbtn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .hbtn[hidden] {
        display: none;
      }
      .hmenu {
        position: relative;
      }
      .pop {
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        z-index: 30;
        width: 280px;
        padding: 12px 16px 16px;
        background: #fff;
        border: 1px solid var(--line-2);
        border-radius: 14px;
        box-shadow: 0 10px 30px #1e1d2214;
      }
      .pop[hidden] {
        display: none;
      }
      .pophead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .popclose {
        width: 28px;
        height: 28px;
        margin-right: -6px;
        border-radius: 999px;
        font-size: 17px;
        line-height: 1;
        color: var(--ink-2);
        transition: background 0.15s;
      }
      .popclose:hover {
        background: var(--surface);
        color: var(--ink);
      }
      .keys {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 9px 14px;
        align-items: center;
        font-size: 13px;
      }
      .keys dt {
        display: flex;
        align-items: center;
        gap: 3px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .keys dd {
        margin: 0;
        color: var(--mute);
      }

      /* ---------------- rail ---------------- */
      #rail {
        border-right: 1px solid var(--line);
        overflow-y: auto;
        overflow-x: hidden;
        min-width: 0;
        overscroll-behavior: contain;
        padding: 0 0 28px;
        scrollbar-width: thin;
        scrollbar-color: var(--line-2) transparent;
      }
      .railhead {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 20px 24px 6px;
      }
      .railhead .count {
        font-size: 11.5px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rowset {
        display: flex;
        flex-direction: column;
      }
      .card {
        position: relative;
        width: var(--rail);
        text-align: left;
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 14px;
        align-items: start;
        padding: 16px 24px 18px;
        border-top: 1px solid var(--line);
        transition: background 0.15s;
      }
      .rowset .card:first-child {
        border-top: 0;
      }
      .card:hover {
        background: var(--surface);
      }
      .card.on {
        background: var(--surface);
      }
      .card.on::before {
        content: '';
        position: absolute;
        left: 0;
        top: -1px;
        bottom: 0;
        width: 2px;
        background: var(--ink);
      }
      .thumb {
        position: relative;
        width: 84px;
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        overflow: hidden;
        background: var(--surface-2);
        margin-top: 4px;
      }
      .thumb canvas,
      .thumb video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cmeta {
        min-width: 0;
      }
      .ctitle {
        font-family: var(--serif);
        font-size: 21px;
        line-height: 1.15;
        letter-spacing: -0.012em;
        color: var(--mute);
        display: flex;
        gap: 10px;
        align-items: baseline;
        transition: color 0.15s;
      }
      .card:hover .ctitle,
      .card.on .ctitle {
        color: var(--ink);
      }
      .cnum {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        flex: none;
        min-width: 14px;
      }
      .ctext {
        min-width: 0;
      }
      .csub {
        margin-top: 6px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--mute);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .cfacts {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      /* ---------------- stage ---------------- */
      #stage {
        position: relative;
        background: #000;
        overflow: hidden;
      }
      #frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      .ov {
        position: absolute;
        z-index: 5;
        pointer-events: none;
      }
      .ov > * {
        pointer-events: auto;
      }
      .panel {
        background: #f0f0f2;
        border: 1px solid #f8f8f9;
        border-radius: 14px;
        color: var(--ink);
      }

      /* edge of the filmed world */
      #edgelab {
        left: 50%;
        transform: translateX(-50%);
        bottom: 24px;
        padding: 10px 16px;
        font-size: 13px;
        color: var(--ink-2);
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.15s;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #edgelab b {
        color: var(--ink);
        font-weight: 600;
      }
      #edgelab span {
        color: var(--mute);
      }

      /* scene actions in the header */
      #play {
        background: var(--pill);
        border-color: var(--pill);
        color: #fff;
        font-weight: 600;
      }
      #play:hover:not(:disabled) {
        background: #000;
        border-color: #000;
        color: #fff;
      }
      #play:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #play.running {
        background: #fff;
        border-color: var(--line-2);
        color: var(--ink);
      }
      .vsep {
        width: 1px;
        height: 22px;
        background: var(--line-2);
        margin: 0 -6px;
      }

      /* loading */
      #loading {
        inset: 0;
        z-index: 8;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        pointer-events: auto;
        transition: opacity 0.35s;
      }
      #loading.gone {
        opacity: 0;
        pointer-events: none;
      }
      #loading.gone > * {
        pointer-events: none;
      }
      #loadvid {
        width: 420px;
        max-width: 60%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        background: #000;
        object-fit: cover;
        margin: 6px 0 10px;
      }
      #loadtitle {
        font-family: var(--serif);
        font-size: 34px;
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: var(--ink);
      }
      #loadbar {
        width: 240px;
        height: 2px;
        background: var(--line-2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
      }
      #loadbar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ink);
        transition: width 0.3s;
      }
      #loadbar.indet i {
        width: 30%;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(333%);
        }
      }
      #loadmsg {
        font-size: 13px;
        color: var(--mute);
        font-variant-numeric: tabular-nums;
        max-width: 420px;
      }
      #loading.failed #loadbar {
        visibility: hidden;
      }
      #loadretry {
        margin-top: 6px;
        height: 38px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--pill);
        color: #fff;
        font-weight: 600;
        font-size: 13.5px;
      }
      #loadretry:hover {
        background: #000;
      }

      /* Narrow viewports: shrink the rail. */
      @media (max-width: 1280px) {
        :root {
          --rail: 260px;
        }
        .ctitle {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell" class="norail">
      <header>
        <button class="railbtn" id="railbtn" aria-label="Show scene list" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="wordmark">Wander</div>
        <div class="spacer"></div>
        <button class="hbtn" id="play" disabled>
          <span id="playlabel">Play camera move</span>
        </button>
        <button class="hbtn" id="srcbtn">Source clip</button>
        <button class="hbtn" id="resetbtn">Reset</button>
        <div class="vsep"></div>
        <button class="hbtn" id="soundbtn" aria-pressed="false" disabled>Sound</button>
        <button class="hbtn" id="audiomodebtn" aria-pressed="false" hidden>Spatial dialogue</button>
        <button class="hbtn" id="questviewbtn">Quest view</button>
        <div class="hmenu">
          <button class="hbtn" id="helpbtn" aria-expanded="false" aria-controls="helppop">
            Controls
          </button>
          <div class="pop" id="helppop" role="dialog" aria-label="Controls" hidden>
            <div class="pophead">
              <span class="label">Controls</span>
              <button class="popclose" id="helpclose" aria-label="Close controls">×</button>
            </div>
            <dl class="keys">
              <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt>
              <dd>walk</dd>
              <dt>drag</dt>
              <dd>look around</dd>
              <dt>scroll</dt>
              <dd>move in and out</dd>
              <dt><kbd>Shift</kbd></dt>
              <dd>faster</dd>
              <dt><kbd>Enter</kbd></dt>
              <dd>play / pause</dd>
              <dt><kbd>V</kbd></dt>
              <dd>source clip</dd>
              <dt><kbd>R</kbd></dt>
              <dd>reset view</dd>
              <dt><kbd>1</kbd>–<kbd>5</kbd></dt>
              <dd>choose a scene</dd>
              <dt><kbd>[</kbd></dt>
              <dd>scene list</dd>
            </dl>
          </div>
        </div>
      </header>

      <nav id="rail">
        <div class="railhead">
          <span class="label">Scenes</span><span class="count" id="railcount"></span>
        </div>
        <div class="rowset" id="primary"></div>
      </nav>

      <main id="stage">
        <iframe
          id="frame"
          allow="autoplay; fullscreen; xr-spatial-tracking; microphone"
          title="Wander viewer"
        ></iframe>

        <div class="ov panel" id="edgelab">
          <b>Edge of what was filmed.</b> Let go and it eases you back.
          <span><kbd>R</kbd> resets the view</span>
        </div>

        <div class="ov" id="loading">
          <div class="label">Source clip</div>
          <video id="loadvid" muted loop playsinline autoplay></video>
          <div id="loadtitle"></div>
          <div id="loadbar" class="indet"><i></i></div>
          <div id="loadmsg" role="status" aria-live="polite">loading…</div>
          <button id="loadretry" hidden>Retry scene</button>
        </div>
      </main>
    </div>

    <script type="module">
      // demo.html — presentation shell around fourd.html. It embeds the viewer in an iframe and
      // dresses it from the outside: fourd.html itself is never modified. Everything below either
      // reads the same-origin `window.wander` API the viewer already exports, or injects one
      // stylesheet into the iframe document at runtime.
      // Walk mode (fourd.html ?walk=1) is the demo camera: a person at eye height on the floor. Default
      // on by default; ?walk=0 gives the free camera back for authoring.
      import '@fontsource/instrument-serif';
      import '@fontsource-variable/manrope';
      import { mountQuestViewPanel } from '/src/quest-view-panel.ts';

      const WALK = new URLSearchParams(location.search).get('walk') !== '0';

      // Scene descriptions reflect source review and matched viewer captures.
      // Refresh them when the selected scene changes; avoid unmeasured quality claims.
      const { CLIPS, ALL } = await import('/src/scene-catalog.ts');

      /* ---------------- rail ---------------- */
      const $ = (id) => document.getElementById(id);
      let current = null;

      // `place` reads "<where> · <camera> · <duration>"; the rail shows only the shot facts, since
      // the room is already named by the title and the thumbnail.
      const shotFacts = (place) =>
        place
          .split('·')
          .slice(1)
          .map((part) => part.trim())
          .join(' · ');

      function makeCard(c, n) {
        const b = document.createElement('button');
        b.className = 'card';
        b.dataset.id = c.id;
        b.innerHTML = `<div class="thumb"><canvas width="184" height="104"></canvas></div>
    <div class="cmeta"><div class="ctitle">${n ? '<span class="cnum"></span>' : ''}<span class="ctext"></span></div><div class="csub"></div><div class="cfacts"></div></div>`;
        if (n) b.querySelector('.cnum').textContent = n;
        b.querySelector('.ctext').textContent = c.title;
        b.querySelector('.csub').textContent = c.sub;
        b.querySelector('.cfacts').textContent = shotFacts(c.place);
        b.addEventListener('click', () => select(c.id));
        poster(c, b.querySelector('canvas'));
        hoverPlay(c, b.querySelector('.thumb'));
        return b;
      }

      // One poster frame per clip, drawn into a canvas and then the decoder is thrown away.
      // No image files are written to disk and nothing keeps decoding in the background.
      function poster(c, cv) {
        const v = document.createElement('video');
        v.muted = true;
        v.playsInline = true;
        v.preload = 'metadata';
        v.src = c.src;
        const draw = () => {
          try {
            const ctx = cv.getContext('2d');
            const s = Math.max(cv.width / v.videoWidth, cv.height / v.videoHeight);
            const w = v.videoWidth * s,
              h = v.videoHeight * s;
            ctx.drawImage(v, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
          } catch {}
          v.removeAttribute('src');
          v.load();
        };
        v.addEventListener(
          'loadedmetadata',
          () => {
            v.currentTime = Math.min(c.poster, (v.duration || 1) - 0.1);
          },
          { once: true },
        );
        v.addEventListener('seeked', draw, { once: true });
        v.addEventListener('error', () => {}, { once: true });
      }

      // Hover a card and the clip itself plays, small and muted. Only ever one at a time.
      let hoverVid = null;
      function hoverPlay(c, thumb) {
        thumb.addEventListener('pointerenter', () => {
          stopHover();
          const v = document.createElement('video');
          v.muted = true;
          v.loop = true;
          v.playsInline = true;
          v.autoplay = true;
          v.src = c.src;
          v.style.position = 'absolute';
          v.style.inset = '0';
          thumb.appendChild(v);
          hoverVid = v;
          v.play().catch(() => {});
        });
        thumb.addEventListener('pointerleave', stopHover);
      }
      function stopHover() {
        if (!hoverVid) return;
        hoverVid.pause();
        hoverVid.removeAttribute('src');
        hoverVid.load();
        hoverVid.remove();
        hoverVid = null;
      }

      CLIPS.forEach((c, i) => $('primary').appendChild(makeCard(c, i + 1)));
      $('railcount').textContent = `${CLIPS.length}`;
      /* ---------------- stage ---------------- */
      const frame = $('frame');
      mountQuestViewPanel({
        stage: $('stage'),
        toggle: $('questviewbtn'),
        isLocalPresenting: () => !!frame.contentWindow?.wander?.spark?.renderer?.xr.isPresenting,
      });
      let ready = false,
        pollTimer = 0,
        loadTimer = 0,
        loadStarted = 0,
        loadFailed = false;

      function beginLoad(c) {
        current = c.id;
        ready = false;
        loadFailed = false;
        loadStarted = performance.now();
        clearInterval(pollTimer);
        clearTimeout(loadTimer);
        loadTimer = setTimeout(() => {
          if (!ready) failLoad('Loading is taking too long. Check your connection and retry.');
        }, 180000);
        for (const el of document.querySelectorAll('.card'))
          el.classList.toggle('on', el.dataset.id === c.id);

        $('play').disabled = true;
        setPlayLabel(false);
        driving.clear();
        $('loading').classList.remove('gone');
        $('loading').classList.remove('failed');
        $('loadretry').hidden = true;
        $('loadmsg').textContent = 'loading the scene…';
        $('loadtitle').textContent = c.title;
        $('loadbar').className = 'indet';
        $('loadbar').firstChild.style.width = '0';
        const lv = $('loadvid');
        if (lv.getAttribute('src') !== c.src) {
          lv.src = c.src;
        }
        lv.currentTime = 0;
        lv.play().catch(() => {});
      }

      function select(id) {
        const c = ALL.find((x) => x.id === id);
        if (!c || (c.id === current && !loadFailed)) return;
        const loadScene = api()?.loadScene;
        beginLoad(c);
        const options = new URLSearchParams({ demo: c.id });
        if (WALK) options.set('walk', '1');
        const outer = new URLSearchParams(location.search);
        for (const [key, value] of outer)
          if (
            key === 'audio' ||
            key === 'personsize' ||
            key.startsWith('xr') ||
            key.startsWith('interact')
          )
            options.set(key, value);
        if (loadScene) {
          // Session events report only the latest request. An older rejected promise
          // must not overwrite the loading/error UI of the user's next selection.
          void loadScene(c.id).catch(() => {});
          watchScene(frame.contentWindow);
        } else {
          api()?.play(false);
          frame.src = `/fourd.html?${options}`;
        }
        outer.set('clip', c.id);
        if (WALK) outer.set('walk', '1');
        history.replaceState(null, '', `?${outer}`);
      }

      function failLoad(message) {
        if (loadFailed) return;
        loadFailed = true;
        clearInterval(pollTimer);
        clearTimeout(loadTimer);
        $('loading').classList.add('failed');
        $('loadmsg').textContent = message;
        $('loadretry').hidden = false;
        $('loadvid').pause();
      }

      $('loadretry').addEventListener('click', () => {
        const id = current;
        current = null;
        select(id);
      });

      frame.addEventListener('load', () => {
        let win;
        try {
          win = frame.contentWindow;
        } catch {
          return;
        }
        dress(win);
        installKeys(win.document);
        installWheel(win.document);
        win.addEventListener('wander:scenechange', (event) => {
          const detail = event.detail;
          const c = ALL.find((clip) => clip.id === detail.id);
          if (detail.error) {
            failLoad(detail.error);
            return;
          }
          if (c) {
            if (detail.loading && (current !== c.id || ready)) beginLoad(c);
            current = c.id;
            for (const card of document.querySelectorAll('.card'))
              card.classList.toggle('on', card.dataset.id === c.id);
            const url = new URL(location.href);
            url.searchParams.set('clip', c.id);
            history.replaceState(null, '', url);
          }
          watchScene(win);
        });
        watchScene(win);
      });

      function watchScene(win) {
        clearInterval(pollTimer);
        pollTimer = setInterval(() => {
          const pending = win.__loadingScene;
          const w = pending ? pending.api : win.wander;
          const st = win.document.getElementById('st');
          if (win.__wanderStartupError || w?.people?.some((p) => p.loadError)) {
            failLoad('The scene could not finish loading. Retry, or choose another scene.');
            return;
          }
          if (!w?.ready && performance.now() - loadStarted > 180000) {
            failLoad('Loading is taking too long. Check your connection and retry.');
            return;
          }
          if (!ready) loadProgress(w, st);
          if (w && w.ready && !pending) {
            ready = true;
            clearInterval(pollTimer);
            clearTimeout(loadTimer);
            $('play').disabled = false;
            $('loading').classList.add('gone');
            const lv = $('loadvid');
            lv.pause();
            lv.removeAttribute('src');
            lv.load();
            try {
              win.focus();
            } catch {}
          }
        }, 180);
      }

      // Before the viewer API exists the world is loading; after it, the per-frame person files stream in
      // and `loaded/nF` on each person is the honest progress.
      function loadProgress(w, st) {
        const bar = $('loadbar');
        if (!w || !w.people) {
          const line = ((st && st.textContent) || '').split('\n').filter(Boolean)[0] || '';
          $('loadmsg').textContent = /world/.test(line) ? 'loading the room…' : 'loading…';
          bar.className = 'indet';
          return;
        }
        const got = w.people.reduce((a, p) => a + p.loaded, 0),
          all = w.people.reduce((a, p) => a + p.nF, 0) || 1;
        bar.className = '';
        bar.firstChild.style.width = Math.round((100 * got) / all) + '%';
        $('loadmsg').textContent =
          `room ready · ${w.people.length > 1 ? 'people' : 'the person'} ${got} / ${all} frames`;
      }

      // One stylesheet injected into the viewer document. fourd.html is not edited: its debug HUD
      // is hidden behind a body class, and its picture-in-picture is repositioned into this shell's
      // layout so the source clip sits under a caption instead of floating in a corner.
      function dress(win) {
        const doc = win.document;
        if (doc.getElementById('wander-demo-chrome')) return;
        const s = doc.createElement('style');
        s.id = 'wander-demo-chrome';
        s.textContent = `
    #hud{display:none!important}
    #walk-map{display:none!important}
    #audio-controls{display:none!important}
    body.wd-hud #hud{display:block!important;left:20px;top:20px;background:#f7f7f8;color:#1e1d22;
      border:1px solid #fff;border-radius:12px;padding:11px 13px;font-size:11px}
    #hint{display:none!important}
    #audio-credit{right:16px!important;bottom:24px!important;padding:6px 10px!important;border-radius:999px!important;
      background:#f0f0f2f2!important;color:#4b4a52!important;border:1px solid #f8f8f9;font:11.5px system-ui!important}
    #audio-credit a{color:#1e1d22!important}
    #pip{left:24px!important;right:auto!important;bottom:24px!important;width:300px!important;
      border:0!important;border-radius:12px;outline:1px solid #ffffff;background:#000}
    #pip.hidden{display:none}
    body.wd-hud #pip{bottom:24px!important}
    #xrBtn{top:20px!important;left:50%!important;right:auto!important;bottom:auto!important;
      transform:translateX(-50%)!important;min-height:38px!important;padding:0 18px!important;
      border:0!important;border-radius:999px!important;background:#2a292f!important;color:#fff!important;
      font:600 13.5px system-ui,sans-serif!important;box-shadow:none!important}
  `;
        doc.head.appendChild(s);
        if (hudOn) doc.body.classList.add('wd-hud');
      }

      /* ---------------- controls ---------------- */
      function setPlayLabel(running) {
        $('play').classList.toggle('running', running);
        $('playlabel').textContent = running
          ? 'Playing — press any key to stop'
          : 'Play camera move';
      }
      function api() {
        try {
          return frame.contentWindow.wander;
        } catch {
          return null;
        }
      }

      $('play').addEventListener('click', () => {
        const w = api();
        if (!w) return;
        void w.unlockAudio?.();
        w.showreel(!w.reel);
        try {
          frame.contentWindow.focus();
        } catch {}
      });
      $('srcbtn').addEventListener('click', () => {
        send('KeyV');
        try {
          frame.contentWindow.focus();
        } catch {}
      });
      $('resetbtn').addEventListener('click', () => {
        const w = api();
        if (!w) return;
        send('KeyR');
        try {
          frame.contentWindow.focus();
        } catch {}
      });
      // The viewer owns R (camera home + avatar home), so ask it rather than reimplementing.
      function send(code) {
        try {
          frame.contentWindow.dispatchEvent(
            new frame.contentWindow.KeyboardEvent('keydown', { code, bubbles: true }),
          );
          frame.contentWindow.dispatchEvent(
            new frame.contentWindow.KeyboardEvent('keyup', { code, bubbles: true }),
          );
        } catch {}
      }

      // Reflect the viewer's own reel state, so driving it with WASD (which cancels the reel)
      // puts the button back by itself.
      let wasRunning = false;
      setInterval(() => {
        const w = api();
        const r = !!(w && w.reel);
        if (r !== wasRunning) {
          wasRunning = r;
          setPlayLabel(r);
        }
      }, 120);

      /* ---------------- edge of the filmed world ----------------
   The viewer's soft boundary lets driven motion coast to a stop at a hard limit where its fade has
   taken the frame to black. Measured on all five stops: any held Shift+key is there within 5-10 s,
   and a black frame with no words on it reads as a crash. Two things from out here: a label that
   says what is happening, and a pull back toward the measured box.
   The viewer damps the NET displacement per frame, so while a key is held the pull has to beat the
   raw drive speed or the camera still reaches the hard limit (measured: edge 0.7-0.9 with a 3/s
   spring). Driving, the pull grows with edge and equals full Shift speed at EDGE_HOLD, so the
   camera settles just under half way into the overshoot band: a clear dim, the label, and it
   stops. Released, it eases home at EASE_RATE. Reel playback and R land the camera exactly and
   are left alone. Inward motion is never damped by the viewer, so this is one position write per frame. */
      const EDGE_HOLD = 0.45,
        EASE_RATE = 3; // 0.45: fade k 0.43, the picture visibly dims but never reads as black (0.3 left the smear at the face plainly visible)
      const DRIVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE']);
      const driving = new Set();
      let wheelAt = 0;
      let edgeLast = performance.now();
      const edgeTmp = { v: null, w: null };
      function edgeLoop(now) {
        requestAnimationFrame(edgeLoop);
        const dt = Math.min(0.05, (now - edgeLast) / 1000);
        edgeLast = now;
        const w = api();
        if (!w || !ready || !w.clampOn) {
          $('edgelab').style.opacity = '0';
          return;
        }
        if (edgeTmp.w !== w) {
          edgeTmp.w = w;
          edgeTmp.v = new w.THREE.Vector3();
          edgeTmp.s = new w.THREE.Vector3();
        }
        const p = w.camera.position,
          b = w.clampBox,
          e = w.edge;
        // inside the box the label ramps up over the last fifth of the way to a face, where the viewer
        // already slows the camera and the invented part of the world begins
        const c = b.getCenter(edgeTmp.s),
          h = b.getSize(edgeTmp.v).multiplyScalar(0.5);
        let near = 0;
        for (const k of 'xyz') near = Math.max(near, Math.abs(p[k] - c[k]) / Math.max(1e-4, h[k]));
        const vis = e > 0.02 ? 1 : Math.max(0, (near - 0.8) / 0.2);
        $('edgelab').style.opacity = vis.toFixed(2);
        if (e <= 0 || w.reel) return;
        edgeTmp.v.copy(p).clamp(b.min, b.max);
        const isDriving = driving.size > 0 || now - wheelAt < 150;
        if (isDriving) {
          const wsz = w.wbox.getSize(edgeTmp.s).length();
          const vmax = 3 * Math.max(0.4, wsz * 0.06); // the viewer's Shift speed, world units/s
          const dist = edgeTmp.v.distanceTo(p);
          if (dist < 1e-6) return;
          const step = Math.min(dist, vmax * (e / EDGE_HOLD) * dt);
          p.lerp(edgeTmp.v, step / dist);
        } else p.lerp(edgeTmp.v, 1 - Math.exp(-EASE_RATE * dt));
      }
      requestAnimationFrame(edgeLoop);

      /* ---------------- HUD + rail ---------------- */
      let hudOn = false,
        railOn = false;
      function toggleHud(v) {
        hudOn = v === undefined ? !hudOn : v;
        try {
          frame.contentWindow.document.body.classList.toggle('wd-hud', hudOn);
        } catch {}
      }
      function toggleRail(v) {
        railOn = v === undefined ? !railOn : v;
        $('shell').classList.toggle('norail', !railOn);
        $('railbtn').setAttribute('aria-expanded', String(railOn));
        $('railbtn').setAttribute('aria-label', railOn ? 'Hide scene list' : 'Show scene list');
      }
      $('railbtn').addEventListener('click', () => toggleRail());

      /* ---------------- sound ----------------
   The viewer's own sound buttons are hidden by dress(); this header button drives its audio through
   the window.wander API and mirrors its state. */
      const soundBtn = $('soundbtn'),
        modeBtn = $('audiomodebtn');
      // Scenes with reviewed spatial tracks offer a second mode; the button only appears for them.
      modeBtn.addEventListener('click', () => {
        const w = api();
        if (!w) return;
        w.setAudioMode(w.audioState.mode === 'spatial' ? 'original' : 'spatial');
        try {
          frame.contentWindow.focus();
        } catch {}
      });
      soundBtn.addEventListener('click', () => {
        const w = api();
        if (!w) return;
        const st = w.audioState;
        if (st.muted || !st.unlocked) {
          w.setMuted(false);
          void w.unlockAudio();
        } else w.setMuted(true);
        try {
          frame.contentWindow.focus();
        } catch {}
      });
      setInterval(() => {
        let st = null;
        try {
          st = ready ? (api()?.audioState ?? null) : null;
        } catch {}
        if (!st) {
          soundBtn.disabled = true;
          soundBtn.classList.remove('on');
          soundBtn.textContent = 'Sound';
          modeBtn.hidden = true;
          return;
        }
        modeBtn.hidden = !st.spatialReady;
        modeBtn.classList.toggle('on', st.mode === 'spatial');
        modeBtn.setAttribute('aria-pressed', String(st.mode === 'spatial'));
        const unavailable = st.hasAudio === false && !st.loading;
        const on = !st.muted && st.unlocked;
        soundBtn.disabled = unavailable;
        soundBtn.classList.toggle('on', on);
        soundBtn.setAttribute('aria-pressed', String(on));
        soundBtn.textContent = st.loading
          ? 'Loading sound…'
          : unavailable
            ? 'No sound'
            : on
              ? 'Sound on'
              : 'Sound off';
      }, 300);

      /* ---------------- controls popover ---------------- */
      const helpBtn = $('helpbtn'),
        helpPop = $('helppop');
      function setHelp(open) {
        helpPop.hidden = !open;
        helpBtn.setAttribute('aria-expanded', String(open));
        helpBtn.classList.toggle('on', open);
      }
      helpBtn.addEventListener('click', () => setHelp(helpPop.hidden));
      $('helpclose').addEventListener('click', () => {
        setHelp(false);
        helpBtn.focus();
      });
      document.addEventListener('pointerdown', (e) => {
        if (!helpPop.hidden && !e.target.closest?.('.hmenu')) setHelp(false);
      });
      // A click into the viewer iframe never reaches this document, but it does blur the window.
      addEventListener('blur', () => setHelp(false));

      // Shortcuts have to be installed in both documents: once the judge clicks into the scene,
      // key events go to the iframe and never reach this page.
      // The viewer's own authoring keys move, turn and scale the avatar with no undo. A judge who
      // rests a hand on the keyboard must not be able to reach them.
      const SWALLOW = new Set([
        'KeyI',
        'KeyK',
        'KeyJ',
        'KeyL',
        'KeyU',
        'KeyO',
        'BracketLeft',
        'BracketRight',
        'Minus',
        'Equal',
        'Comma',
        'Period',
        'KeyN',
      ]);
      // Driving keys pressed while focus is on this page (after clicking a card or a header button) are
      // handed to the viewer, so W always walks no matter what was clicked last.
      const FORWARD = new Set([
        'KeyW',
        'KeyA',
        'KeyS',
        'KeyD',
        'KeyQ',
        'KeyE',
        'ShiftLeft',
        'ShiftRight',
        'KeyR',
        'KeyV',
        'KeyP',
        'Space',
        'Enter',
        'NumpadEnter',
      ]);
      if (WALK)
        for (const k of ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']) {
          DRIVE_KEYS.add(k);
          FORWARD.add(k);
        }
      function forward(e) {
        try {
          const win = frame.contentWindow;
          if (
            e.isTrusted &&
            e.type === 'keydown' &&
            !e.repeat &&
            ['Enter', 'NumpadEnter', 'Space'].includes(e.code)
          )
            void win.wander?.unlockAudio?.();
          win.dispatchEvent(
            new win.KeyboardEvent(e.type, {
              code: e.code,
              key: e.key,
              shiftKey: e.shiftKey,
              repeat: e.repeat,
              bubbles: true,
            }),
          );
          if (e.type === 'keydown') win.focus();
        } catch {}
      }
      function installKeys(doc) {
        doc.addEventListener(
          'keydown',
          (e) => {
            if (DRIVE_KEYS.has(e.code)) driving.add(e.code);
          },
          true,
        );
        doc.addEventListener('keyup', (e) => driving.delete(e.code), true);
        doc.defaultView.addEventListener('blur', () => driving.clear());
        if (doc === document)
          doc.addEventListener(
            'keyup',
            (e) => {
              if (FORWARD.has(e.code)) forward(e);
            },
            true,
          );
        doc.addEventListener(
          'keydown',
          (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (
              (e.code === 'Enter' || e.code === 'NumpadEnter') &&
              (e.target.isContentEditable ||
                e.target.closest?.('button, input, textarea, select, a'))
            )
              return;
            // `[` toggles the rail here and must not reach the viewer's own `[` action, so it is
            // handled before the swallow list that otherwise suppresses it.
            if (e.code === 'BracketLeft') {
              e.stopImmediatePropagation();
              e.preventDefault();
              toggleRail();
              return;
            }
            if (SWALLOW.has(e.code)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return;
            }
            if (doc === document && FORWARD.has(e.code) && ready) {
              e.preventDefault();
              forward(e);
              return;
            }
            if (e.code === 'KeyH') {
              e.stopImmediatePropagation();
              e.preventDefault();
              toggleHud();
              return;
            }
            if (e.code === 'Escape') {
              setHelp(false);
              return;
            }
            const n = /^Digit([1-9])$/.exec(e.code);
            if (n && +n[1] <= CLIPS.length) {
              e.preventDefault();
              select(CLIPS[+n[1] - 1].id);
            }
          },
          true,
        );
      }
      installKeys(document);

      // Trackpads have no comfortable held-key-plus-drag, so two-finger scroll walks the camera along its
      // look direction. Small steps only: the viewer treats a jump over 2 units as a teleport and skips
      // its soft boundary for it. `upm` is the viewer's world units per metre.
      function installWheel(doc) {
        doc.addEventListener(
          'wheel',
          (e) => {
            const w = api();
            if (!w || !ready) return;
            e.preventDefault();
            if (w.reel) w.showreel(false);
            wheelAt = performance.now();
            // 0.0006 m per scroll pixel: a full trackpad flick (~1500 px) is about 0.9 m, a mouse notch (100 px) 6 cm.
            // Set from synthetic wheel events only; try it on the booth laptop and halve or double it by feel.
            const step = Math.max(-0.12, Math.min(0.12, -e.deltaY * 0.0006 * w.upm));
            w.camera.position.addScaledVector(
              w.camera.getWorldDirection(new w.THREE.Vector3()),
              step,
            );
          },
          { passive: false },
        );
      }

      /* ---------------- boot ---------------- */
      const want = new URLSearchParams(location.search).get('clip');
      select(ALL.some((c) => c.id === want) ? want : CLIPS[0].id);
    </script>
  </body>
</html>
