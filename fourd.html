<!doctype html><meta charset="utf-8" /><title>Marble world + moving person</title>
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23bcd'/%3E%3C/svg%3E"
/>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font:
      12px ui-monospace,
      monospace;
    color: #ddd;
  }
  #hud {
    position: fixed;
    left: 12px;
    top: 12px;
    z-index: 9;
    background: #000a;
    padding: 8px 10px;
    border-radius: 6px;
    line-height: 1.45;
    white-space: pre;
  }
  #pip {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 9;
    width: 320px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #000;
  }
  #pip.hidden {
    display: none;
  }
  #startup-error {
    position: fixed;
    inset: 16px 16px auto;
    z-index: 10;
    padding: 16px;
    background: #211;
    color: #fff;
    font: 16px system-ui;
  }
  /* phone: the HUD is 950 px of pre-formatted text and the PiP is 320 px wide, so both run off a
   narrow screen. Wrap one and shrink the other; nothing changes above 760 px. */
  @media (max-width: 760px) {
    #hud {
      font-size: 10px;
      left: 6px;
      top: 6px;
      right: 6px;
      white-space: pre-wrap;
      padding: 6px 7px;
    }
    #pip {
      width: 150px;
      right: 6px;
      bottom: 6px;
    }
    #hint {
      font-size: 11px !important;
      padding: 4px 8px !important;
      bottom: 8px !important;
      left: 6px !important;
      right: 6px !important;
      transform: none !important;
      text-align: center;
      margin-bottom: 96px;
    }
  }
</style>
<template id="scene-template">
  <div id="hud">
    <span id="help"
      >W A S D move · Q/E down/up · drag to look · Shift faster · R home person: I/K ±z J/L ±x U/O
      ±y [ ] yaw - = scale · Enter / Space play/pause · , . step frame · V video · N snap keyframes
      · H hide help</span
    >
    <span id="st">loading…</span>
  </div>
  <div
    id="hint"
    style="
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 9;
      background: #000a;
      padding: 6px 12px;
      border-radius: 6px;
      font: 14px system-ui;
      color: #eee;
      display: none;
    "
  >
    P = 20 s showreel · WASD + drag = free camera · Enter / Space = play/pause · V = source video
  </div>
  <video id="pip" muted loop playsinline autoplay></video>
  <div
    id="edgefade"
    style="
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0.8) 48%,
        #000 100%
      );
    "
  ></div>
</template>
<script>
  // Available even if a module import or top-level asset load fails before the viewer API exists.
  window.__wanderStartupError = false;
  const reportStartupFailure = () => {
    if (window.wander?.ready) return;
    window.__wanderStartupError = true;
    let error = document.getElementById('startup-error');
    if (!error) {
      error = document.createElement('div');
      error.id = 'startup-error';
      error.setAttribute('role', 'alert');
      document.body.append(error);
    }
    error.textContent = 'Scene could not load. Reload to retry.';
  };
  window.addEventListener(
    'error',
    (event) => {
      if (event.target === window || event.target?.tagName === 'SCRIPT') reportStartupFailure();
    },
    true,
  );
  window.addEventListener('unhandledrejection', reportStartupFailure);
</script>
<script type="module">
  import { startFourD } from '/src/fourd-session.js';
  startFourD(document.getElementById('scene-template'));
</script>
