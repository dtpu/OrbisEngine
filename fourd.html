<!doctype html><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wander · Scene viewer</title>
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23bcd'/%3E%3C/svg%3E"
/>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font:
      12px ui-monospace,
      monospace;
    color: #ddd;
  }
  :root {
    color-scheme: dark;
  }
  button,
  summary,
  input {
    touch-action: manipulation;
  }
  button:focus-visible,
  summary:focus-visible,
  input:focus-visible,
  a:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 4px;
  }
  #viewer-heading {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
    z-index: 9;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
    font:
      13px system-ui,
      sans-serif;
    text-shadow: 0 1px 8px #000;
  }
  #viewer-heading strong {
    font-size: 20px;
    letter-spacing: -0.6px;
    color: #fff;
  }
  #viewer-heading span {
    border-left: 1px solid #ffffff60;
    padding-left: 12px;
    color: #eee;
  }
  #hud {
    position: fixed;
    left: max(20px, env(safe-area-inset-left));
    top: max(64px, calc(env(safe-area-inset-top) + 44px));
    z-index: 31;
    max-width: calc(100vw - 40px);
    max-height: calc(100dvh - 240px);
    box-sizing: border-box;
    overflow: auto;
    background: #111f;
    border: 1px solid #383838;
    padding: 0 14px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    box-shadow: 0 8px 32px #0003;
  }
  #hud summary {
    cursor: pointer;
    white-space: normal;
    font: 13px system-ui;
    padding: 13px 0;
    min-height: 44px;
    box-sizing: border-box;
  }
  #hud[open] {
    padding-bottom: 14px;
  }
  #clip-controls {
    position: fixed;
    left: max(20px, env(safe-area-inset-left));
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 30;
    width: min(520px, calc(100vw - 384px));
    box-sizing: border-box;
    background: #111f;
    border: 1px solid #383838;
    border-radius: 16px;
    padding: 12px 16px 6px;
    font:
      13px system-ui,
      sans-serif;
    box-shadow: 0 8px 32px #0004;
  }
  .transport-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .transport-heading span {
    color: #a1a1a1;
    font-size: 12px;
  }
  #clip-controls .transport-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #clip-controls button {
    background: #202020;
    color: #fafafa;
    border: 1px solid #444;
    border-radius: 8px;
    min-height: 44px;
    padding: 0 14px;
    font: 500 13px system-ui;
    cursor: pointer;
  }
  #clip-controls [data-play] {
    background: #ededed;
    color: #171717;
    border-color: #ededed;
    min-width: 94px;
  }
  #clip-controls button:hover:not(:disabled) {
    background: #333;
  }
  #clip-controls [data-play]:hover:not(:disabled) {
    background: #fff;
  }
  #clip-controls button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #clip-controls output {
    margin-left: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: #bdbdbd;
    font-size: 12px;
  }
  #clip-controls input {
    display: block;
    width: 100%;
    height: 32px;
    margin: 2px 0 0;
    accent-color: #ededed;
    cursor: pointer;
  }
  #clip-controls [data-loading] {
    margin: 0 0 8px;
    color: #bdbdbd;
  }
  #audio-controls {
    left: max(20px, env(safe-area-inset-left));
    right: auto !important;
    bottom: max(158px, calc(env(safe-area-inset-bottom) + 138px)) !important;
    flex-wrap: wrap;
    max-width: calc(100vw - 40px);
  }
  #audio-controls button {
    min-height: 44px;
    background: #171717 !important;
    border-color: #444 !important;
  }
  #audio-credit {
    left: 20px;
    right: auto !important;
    bottom: 210px !important;
  }
  #pip {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 9;
    width: 320px;
    border: 1px solid #ffffff40;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 8px 32px #0004;
  }
  #pip.hidden {
    display: none;
  }
  #startup-error {
    position: fixed;
    inset: 16px 16px auto;
    z-index: 10;
    padding: 16px;
    background: #211;
    color: #fff;
    font: 16px system-ui;
  }
  @media (max-width: 760px) {
    #viewer-heading {
      top: max(16px, env(safe-area-inset-top));
      left: 12px;
    }
    #hud {
      left: 12px;
      max-width: calc(100vw - 24px);
      font-size: 11px;
    }
    #clip-controls {
      left: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: calc(100vw - 24px);
      padding-inline: 12px;
    }
    #audio-controls {
      left: 12px;
      bottom: max(150px, calc(env(safe-area-inset-bottom) + 138px)) !important;
      max-width: calc(100vw - 24px);
    }
    #audio-credit {
      left: 12px;
      bottom: 200px !important;
    }
    #pip {
      width: 150px;
      right: 12px;
      bottom: max(220px, calc(env(safe-area-inset-bottom) + 208px));
    }
    .transport-heading span {
      display: none;
    }
    #hint {
      display: none !important;
    }
  }
  @media (max-height: 500px) and (min-width: 761px) {
    #hud {
      max-height: calc(100dvh - 100px);
    }
  }
</style>
<template id="scene-template">
  <div id="viewer-heading"><strong>Wander</strong><span>Scene preview</span></div>
  <details id="hud">
    <summary>Scene details &amp; controls</summary>
    <span id="help"
      >W A S D move · Q/E down/up · drag to look · Shift faster · R home person: I/K ±z J/L ±x U/O
      ±y [ ] yaw - = scale · Enter / Space play/pause · , . step frame · V video · N snap keyframes
      · H hide help</span
    >
    <span id="st">loading…</span>
  </details>
  <div id="clip-controls" role="group" aria-label="Clip playback">
    <div class="transport-heading">
      <strong>Playback</strong><span>WASD to move · Drag to look</span>
    </div>
    <p data-loading role="status">Loading scene…</p>
    <div class="transport-row">
      <button type="button" data-play disabled>Play clip</button>
      <button type="button" data-replay disabled>Replay</button>
      <output aria-label="Playback time">0:00.0 / 0:00.0</output>
    </div>
    <input
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0"
      aria-label="Clip timeline"
      disabled
    />
  </div>
  <div
    id="hint"
    style="
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 9;
      background: #000a;
      padding: 6px 12px;
      border-radius: 6px;
      font: 14px system-ui;
      color: #eee;
      display: none;
    "
  >
    P = 20 s showreel · WASD + drag = free camera · Enter / Space = play/pause · V = source video
  </div>
  <video id="pip" aria-label="Original source video" muted loop playsinline autoplay></video>
  <div
    id="edgefade"
    style="
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.5) 0%,
        rgba(0, 0, 0, 0.8) 48%,
        #000 100%
      );
    "
  ></div>
</template>
<script>
  // Available even if a module import or top-level asset load fails before the viewer API exists.
  window.__wanderStartupError = false;
  const reportStartupFailure = () => {
    if (window.wander?.ready) return;
    window.__wanderStartupError = true;
    let error = document.getElementById('startup-error');
    if (!error) {
      error = document.createElement('div');
      error.id = 'startup-error';
      error.setAttribute('role', 'alert');
      document.body.append(error);
    }
    error.textContent = 'Scene could not load. Reload to retry.';
  };
  window.addEventListener(
    'error',
    (event) => {
      if (event.target === window || event.target?.tagName === 'SCRIPT') reportStartupFailure();
    },
    true,
  );
  window.addEventListener('unhandledrejection', reportStartupFailure);
</script>
<script type="module">
  import { startFourD } from '/src/fourd-session.js';
  startFourD(document.getElementById('scene-template'));
</script>
