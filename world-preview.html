<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World preview · Orbis Engine</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #16171a;
        color: #eee;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #viewport {
        position: fixed;
        inset: 0;
      }
      header {
        position: relative;
        z-index: 1;
        max-width: 620px;
        max-height: calc(100dvh - 32px);
        overflow: auto;
        overflow-wrap: anywhere;
        margin: 16px;
        padding: 20px;
        border: 1px solid #555;
        border-radius: 12px;
        background: #1b1d22ee;
      }
      h1 {
        margin: 8px 0;
        font-size: 24px;
      }
      p {
        margin: 8px 0;
      }
      a {
        color: #d6e7ff;
      }
      button {
        padding: 7px 12px;
        color: #eee;
        background: #333741;
        border: 1px solid #727884;
        border-radius: 5px;
        cursor: pointer;
      }
      #status {
        color: #cbd3de;
      }
      [data-state='error'] #status {
        color: #ffb5b5;
      }
      @media (max-width: 640px) {
        header {
          margin: 8px;
          padding: 12px;
          font-size: 13px;
          max-height: calc(100dvh - 16px);
        }
      }
    </style>
  </head>
  <body data-state="loading">
    <div id="viewport" aria-label="Interactive world preview"></div>
    <header>
      <a href="/">← Back to dashboard</a>
      <h1>World preview</h1>
      <p>
        People and recorded audio are not included. Generated appearance and unobserved geometry may
        be invented. Scale and alignment are unverified.
      </p>
      <p>Drag to orbit · right-drag to pan · scroll to zoom</p>
      <p id="status" role="status" aria-live="polite">Loading local world…</p>
      <button id="reset" type="button" disabled>Generation origin</button>
      <button id="overview" type="button" disabled>Fit whole world</button>
    </header>
    <script type="module" src="/src/world-preview.ts"></script>
  </body>
</html>
